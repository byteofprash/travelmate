name = "travelmate-email"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Keep the settings you enter in the Cloudflare dashboard (Worker → Settings → Variables and Secrets) when the worker
# is deployed again. Without this, a deploy replaces dashboard values with whatever is in this file.
keep_vars = true

# These plain variables are committed here and match the dashboard. (With keep_vars, dashboard values are kept
# on deploy, but values listed here are applied too.)
#   INBOUND_URL      the app's address plus /api/inbound
#   ALLOWED_SENDERS  comma-separated addresses allowed to send to this worker (the address you forward from)
# And this one is a Secret, never in this file:
#   INBOUND_SECRET   the same value as INBOUND_SECRET in the server .env
[vars]
INBOUND_URL = "https://travel.byteofprash.com/api/inbound"
ALLOWED_SENDERS = "swaminathan@talon.one,prash2912@gmail.com"
